<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Практическая работа</title>
<style>
body{margin:0;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f6f9;color:#1d2433;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{background:#fff;border:1px solid #d9dee7;border-radius:14px;padding:28px 22px;max-width:420px;margin:16px;text-align:center}
.big{font-size:22px;font-weight:600;margin-bottom:8px}
.spin{width:36px;height:36px;border:4px solid #d9dee7;border-top-color:#2a62d6;border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
button{font:inherit;border:0;border-radius:8px;padding:10px 16px;background:#2a62d6;color:#fff;margin-top:12px}
</style>
</head>
<body>
<div class="box" id="box"><div class="spin"></div><div>Загрузка работы…</div></div>
<script>
(function(){
// Адрес Google-скрипта учителя (заканчивается на /exec)
const SU = "https://script.google.com/macros/s/AKfycbz8z4OjmKo4OWNLc__y4eTCGNQd6lm7VkZhgZvAZ6Q6NlWhcjvHS9tnyi2zapNbweaYiA/exec";
const k = (new URLSearchParams(location.search).get('k') || '').trim().toUpperCase();
function msg(title, text, retry){
  document.getElementById('box').innerHTML = `<div class="big">${title}</div><div>${text}</div>` + (retry ? '<button onclick="location.reload()">Попробовать ещё раз</button>' : '');
}
if(!k){ msg('🔒 Нет кода урока', 'Откройте работу по QR-коду, который показывает учитель.'); }
else {
  fetch(SU + '?action=work&k=' + encodeURIComponent(k) + '&t=' + Date.now(), {cache:'no-store'})
    .then(r => r.json())
    .then(j => {
      if(!j.ok){ msg('🔒 Доступ к работе закрыт', 'Работа доступна только во время урока по QR-коду учителя.'); return; }
      const skew = (j.now||Date.now()) - Date.now();
      const html = j.html.split('__SCRIPT_'+'URL__').join(SU).split('__LESSON_'+'CODE__').join(k).split('__LESSON_'+'UNTIL__').join(String((j.until||0) - skew));
      document.open(); document.write(html); document.close();
    })
    .catch(() => msg('Нет связи', 'Не удалось загрузить работу. Проверьте интернет.', true));
}
})();
</script>
</body>
</html>
