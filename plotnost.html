<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Плотность вещества · Заттың тығыздығы</title>
<style>
body{margin:0;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#eef2f7;color:#1d2433;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{background:#fff;border-radius:16px;padding:28px 22px;max-width:420px;margin:16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.big{font-size:21px;font-weight:700;margin-bottom:8px}
.spin{width:36px;height:36px;border:4px solid #d9dee7;border-top-color:#2f6fed;border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:#2f6fed;color:#fff;margin-top:12px}
</style>
</head>
<body>
<div class="box" id="box"><div class="spin"></div><div>Жүктелуде… · Загрузка…</div></div>
<script>
(function(){
// Адрес Google-скрипта таблицы с результатами (заканчивается на /exec)
const SU = "https://script.google.com/macros/s/AKfycbzH2L544t6rwYafdMD_hLSRgihBpOLMOb7YIWGHtLKFyy4teAEylux35FsNbL4H96GZkw/exec";
fetch(SU + '?action=pub&t=' + Date.now(), {cache:'no-store'})
  .then(r => r.json())
  .then(j => {
    if(!j.ok) throw 0;
    const html = j.html.split('__SCRIPT_'+'URL__').join(SU);
    document.open(); document.write(html); document.close();
  })
  .catch(() => {
    document.getElementById('box').innerHTML = '<div class="big">Байланыс жоқ · Нет связи</div><div>Интернетті тексеріңіз · Проверьте интернет</div><button onclick="location.reload()">Қайталау · Повторить</button>';
  });
})();
</script>
</body>
</html>
