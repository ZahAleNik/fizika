<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>plotnost.html для GitHub</title>
<style>body{margin:0;font:17px/1.5 system-ui,sans-serif;background:#eef2f7}main{max-width:640px;margin:0 auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
button{display:block;width:100%;border:0;border-radius:14px;background:#2f6fed;color:#fff;font-size:19px;font-weight:700;padding:16px;margin-top:10px}button.ok{background:#1f8a4c}code{background:#eef2f7;padding:2px 6px;border-radius:6px;font-weight:700}textarea{width:100%;height:90px;display:none;margin-top:8px}</style></head>
<body><main><div class="card"><b>Файл для GitHub:</b> <code>plotnost.html</code><ol><li>Нажмите «Скопировать».</li><li>GitHub → репозиторий fizika → «…» или «＋» → <b>Create new file</b>.</li><li>Имя: <b>plotnost.html</b></li><li>Вставьте текст → <b>Commit changes</b>.</li></ol>
<button id="b">📋 Скопировать код</button><textarea id="t" readonly></textarea></div></main>
<script>const F="<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1\">\n<title>Плотность вещества · Заттың тығыздығы<\/title>\n<style>\nbody{margin:0;font:17px/1.5 system-ui,-apple-system,\"Segoe UI\",Roboto,Arial,sans-serif;background:#eef2f7;color:#1d2433;display:flex;min-height:100vh;align-items:center;justify-content:center}\n.box{background:#fff;border-radius:16px;padding:28px 22px;max-width:420px;margin:16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}\n.big{font-size:21px;font-weight:700;margin-bottom:8px}\n.spin{width:36px;height:36px;border:4px solid #d9dee7;border-top-color:#2f6fed;border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}\n@keyframes r{to{transform:rotate(360deg)}}\nbutton{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:#2f6fed;color:#fff;margin-top:12px}\n<\/style>\n<\/head>\n<body>\n<div class=\"box\" id=\"box\"><div class=\"spin\"><\/div><div>Жүктелуде… · Загрузка…<\/div><\/div>\n<script>\n(function(){\n// Адрес Google-скрипта таблицы с результатами (заканчивается на /exec)\nconst SU = \"https://script.google.com/macros/s/AKfycbylN9Uym2ckA8hfszCU55cukE8s-xqAsdmr_2Aaq7YBrYIsCJflEUqv3h9mtYBmaBPp/exec\";\nfetch(SU + '?action=pub&t=' + Date.now(), {cache:'no-store'})\n  .then(r => r.json())\n  .then(j => {\n    if(!j.ok) throw 0;\n    const html = j.html.split('__SCRIPT_'+'URL__').join(SU);\n    document.open(); document.write(html); document.close();\n  })\n  .catch(() => {\n    document.getElementById('box').innerHTML = '<div class=\"big\">Байланыс жоқ · Нет связи<\/div><div>Интернетті тексеріңіз · Проверьте интернет<\/div><button onclick=\"location.reload()\">Қайталау · Повторить<\/button>';\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n";const b=document.getElementById('b'),t=document.getElementById('t');
b.onclick=()=>{const ok=()=>{b.textContent='✓ Скопировано — вставьте на GitHub';b.classList.add('ok');};const fb=()=>{t.style.display='block';t.value=F;t.select();try{if(document.execCommand('copy'))return ok();}catch(e){}b.textContent='Выделите текст ниже и скопируйте';};
if(navigator.clipboard)navigator.clipboard.writeText(F).then(ok,fb);else fb();};</script></body></html>
