<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Практикалық жұмыс: денелердің көлемі</title>
<style>
body{margin:0;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f6f9;color:#1d2433;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{background:#fff;border:1px solid #d9dee7;border-radius:14px;padding:28px 22px;max-width:420px;margin:16px;text-align:center}
.spin{width:36px;height:36px;border:4px solid #d9dee7;border-top-color:#2a62d6;border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
button{font:inherit;border:0;border-radius:8px;padding:10px 16px;background:#2a62d6;color:#fff;margin-top:12px}
</style>
</head>
<body>
<div class="box" id="box"><div class="spin"></div><div>Жұмыс жүктелуде…</div></div>
<script>
(function(){
const SU = "https://script.google.com/macros/s/AKfycbz8z4OjmKo4OWNLc__y4eTCGNQd6lm7VkZhgZvAZ6Q6NlWhcjvHS9tnyi2zapNbweaYiA/exec";
fetch(SU + '?action=pub&w=kolem&t=' + Date.now(), {cache:'no-store'})
  .then(r => r.json())
  .then(j => { if(!j.ok) throw new Error(); document.open(); document.write(j.html); document.close(); })
  .catch(() => { document.getElementById('box').innerHTML = '<div>Жұмысты жүктеу мүмкін болмады. Интернетті тексеріңіз.</div><button onclick="location.reload()">Қайталап көру</button>'; });
})();
</script>
</body>
</html>
