<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="light only">
<title>КПД цикла</title>
<style>
:root{color-scheme:light only}
body{margin:0;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#eef2f7;color:#1d2433;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{background:#fff;border-radius:16px;padding:28px 22px;max-width:420px;margin:16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.big{font-size:21px;font-weight:700;margin-bottom:8px}
.spin{width:36px;height:36px;border:4px solid #d9dee7;border-top-color:#2f6fed;border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:#2f6fed;color:#fff;margin-top:12px}
</style>
</head>
<body>
<div class="box" id="box"><div class="spin"></div><div>Загрузка…</div></div>
<script>
(function(){
const SU = "https://script.google.com/macros/s/AKfycbxNncDvujeXRCQk7oOqqnfgFBqvG77OshP8rc8amCcTQiTwiJtDXiJNupogkzKtZp_ZWw/exec";
const CODE = (new URLSearchParams(location.search).get('t') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
const box = document.getElementById('box');
const say = (big, small, again) => { box.innerHTML = '<div class="big">' + big + '</div><div>' + small + '</div>' + (again ? '<button onclick="location.reload()">Повторить</button>' : ''); };
if (!CODE) { say('Нет ссылки', 'Откройте работу по ссылке от учителя.', false); return; }
fetch(SU + '?action=pub&code=' + CODE + '&t=' + Date.now(), {cache:'no-store'})
  .then(r => r.json())
  .then(j => {
    if (!j.ok && j.error === 'closed') { say('🔒 Работа закрыта', 'Учитель закрыл эту ссылку.', false); return; }
    if (!j.ok && j.error === 'code') { say('Ссылка недействительна', 'Попросите у учителя новую ссылку.', false); return; }
    if (!j.ok || !j.b64) throw 0;
    const bin = atob(j.b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const html = new TextDecoder('utf-8').decode(bytes);
    document.open(); document.write(html); document.close();
  })
  .catch(() => say('Нет связи', 'Проверьте интернет.', true));
})();
</script>
</body>
</html>
