<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Домашнее задание</title>
<style>
body{margin:0;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f6f9;color:#1d2433;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{background:#fff;border:1px solid #d9dee7;border-radius:14px;padding:28px 22px;max-width:420px;margin:16px;text-align:center}
.big{font-size:22px;font-weight:600;margin-bottom:8px}
.spin{width:36px;height:36px;border:4px solid #d9dee7;border-top-color:#2a62d6;border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
button{font:inherit;border:0;border-radius:8px;padding:10px 16px;background:#2a62d6;color:#fff;margin-top:12px}
</style>
</head>
<body>
<div class="box" id="box"><div class="spin"></div><div>Загрузка домашнего задания…</div></div>
<script>
(function(){
// Адрес Google-скрипта таблицы ДЗ (заканчивается на /exec)
const SU = "https://script.google.com/macros/s/AKfycbwuUENwineifbzOUq7YVEScjl-rZKPI8SgTFrbCD5u1VmyxKXlIsLc0T4A63t23MnnI/exec";
const k = (new URLSearchParams(location.search).get('k') || '').trim().toUpperCase();
function msg(title, text, retry){
  document.getElementById('box').innerHTML = `<div class="big">${title}</div><div>${text}</div>` + (retry ? '<button onclick="location.reload()">Попробовать ещё раз</button>' : '');
}
if(!k){ msg('🔗 Нет кода задания', 'Откройте домашнее задание по ссылке учителя.'); return; }
fetch(SU + '?action=pub&k=' + encodeURIComponent(k) + '&t=' + Date.now(), {cache:'no-store'})
  .then(r => r.json())
  .then(j => {
    if(!j.ok){
      if(j.error==='closed') msg('⏰ Срок сдачи истёк', 'Это домашнее задание больше не принимается.');
      else msg('🔗 Ссылка не найдена', 'Проверьте ссылку от учителя.');
      return;
    }
    const html = j.html.split('__SCRIPT_'+'URL__').join(SU).split('__DZ_'+'CODE__').join(k)
      .split('__DZ_'+'CLASS__').join(String(j.cls||'').replace(/['"\\<>]/g,'')).split('__DZ_'+'UNTIL__').join(String(j.until||0));
    document.open(); document.write(html); document.close();
  })
  .catch(() => msg('Нет связи', 'Не удалось загрузить задание. Проверьте интернет.', true));
})();
</script>
</body>
</html>
