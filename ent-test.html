<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<title>ЕНТ — онлайн-тестирование</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,sans-serif}
header{background:#1749aa;color:#fff;text-align:center;padding:16px;font-size:20px;font-weight:bold}
main{max-width:750px;margin:16px auto;padding:12px}
.card{background:#fff;padding:22px;border-radius:18px;box-shadow:0 4px 20px #0001}
h1{color:#1749aa;margin-top:0;font-size:24px}
.field{display:block;font-weight:bold;margin:16px 0 7px}
input[type=text],select{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;color:#172033;background:#fff}
button{width:100%;border:0;background:#1954c5;color:#fff;padding:15px;border-radius:10px;font-size:16px;margin-top:20px;cursor:pointer}
button:disabled{opacity:.5}
.question{padding:17px 0;border-bottom:1px solid #e2e8f0}
.question h3{font-size:17px;margin:0 0 8px}
.option{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid #cbd5e1;border-radius:9px;margin:9px 0;cursor:pointer}
.option.sel{background:#eaf1ff;border-color:#1954c5}
.subj{padding:14px;border:1px solid #cbd5e1;border-radius:10px;margin:8px 0;font-size:16px;cursor:pointer;background:#fff;user-select:none}
.subj.sel{background:#1954c5;border-color:#1954c5;color:#fff;font-weight:bold}
.hidden{display:none}
.muted{color:#64748b}
.error{color:#b91c1c}
.score{font-size:48px;font-weight:bold;color:#1954c5}
</style>
</head>
<body>
<header>ЕНТ · Онлайн-тестирование</header>
<main>
<section class="card" id="entry">
<h1>Пробный ЕНТ</h1>
<p class="muted">20 вопросов по выбранному предмету</p>

<label class="field" for="name">Фамилия и имя</label>
<input id="name" type="text" placeholder="Иванов Иван" maxlength="100">

<label class="field" for="cls">Класс</label>
<input id="cls" type="text" placeholder="11А" maxlength="30">

<label class="field">Предмет</label>
<div id="subjects"></div>

<button id="start" onclick="begin()">Начать тестирование</button>
<p id="entryError" class="error"></p>
</section>

<section class="card hidden" id="test">
<h1 id="title"></h1>
<p class="muted">Выберите один ответ на каждый вопрос.</p>
<div id="questions"></div>
<button id="finish" onclick="finishTest()">Завершить тест</button>
<p id="testError" class="error"></p>
</section>

<section class="card hidden" id="done">
<h1>Тест завершён!</h1>
<p>Ваш результат:</p>
<div class="score" id="score"></div>
<p>Результат отправлен преподавателю.</p>
</section>
</main>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzvoMNjElhxNlMOda9CLusFM2pp12zKTPS6fypLeWzjIYh8Gka7Cfz1lvRK5eYWPi43/exec';
const SESSION = new URLSearchParams(location.search).get('session') || '';
const ABC = 'ABCD';
const el = id => document.getElementById(id);
let quiz = [];

function show(id) {
  ['entry','test','done'].forEach(x => el(x).classList.toggle('hidden', x !== id));
  window.scrollTo(0, 0);
}

async function apiGet(params) {
  const r = await fetch(API + '?' + new URLSearchParams(params));
  const d = await r.json();
  if (!d.ok) throw Error(d.error || 'Ошибка');
  return d;
}

async function apiPost(data) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(data)
  });
  const d = await r.json();
  if (!d.ok) throw Error(d.error || 'Ошибка');
  return d;
}

// Предметы — прямо здесь, список появляется сразу, без загрузки.
// (Должен совпадать с SUBJECTS в Code.gs.)
const SUBJECTS = ['Динамика', 'Химия', 'Биология', 'Информатика', 'Всемирная история'];
let subject = '';

SUBJECTS.forEach(s => {
  const b = document.createElement('div');
  b.className = 'subj';
  b.textContent = s;
  b.onclick = () => {
    subject = s;
    document.querySelectorAll('.subj').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
  };
  el('subjects').append(b);
});

if (!SESSION) {
  el('entryError').textContent = 'Неверная ссылка: отсканируйте QR-код заново.';
  el('start').disabled = true;
}

async function begin() {
  const name = el('name').value.trim();
  const cls = el('cls').value.trim();

  if (name.length < 3 || !cls || !subject) {
    el('entryError').textContent = !subject ? 'Выберите предмет.' : 'Заполните все поля.';
    return;
  }

  el('start').disabled = true;
  el('start').textContent = 'Загрузка...';
  el('entryError').textContent = '';

  try {
    const d = await apiGet({ action: 'questions', session: SESSION, subject: subject });
    quiz = d.questions;
    el('title').textContent = subject;
    const area = el('questions');
    area.replaceChildren();

    quiz.forEach((q, i) => {
      const sec = document.createElement('section');
      sec.className = 'question';
      const h = document.createElement('h3');
      h.textContent = (i + 1) + '. ' + q.text;
      sec.append(h);

      q.options.forEach((opt, j) => {
        const label = document.createElement('label');
        label.className = 'option';
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'q' + i;
        radio.value = ABC[j];
        radio.onchange = () => {
          sec.querySelectorAll('.option').forEach(o => o.classList.remove('sel'));
          label.classList.add('sel');
        };
        const span = document.createElement('span');
        span.textContent = ABC[j] + ') ' + opt;
        label.append(radio, span);
        sec.append(label);
      });
      area.append(sec);
    });
    show('test');
  } catch (e) {
    el('entryError').textContent = e.message;
  }
  el('start').disabled = false;
  el('start').textContent = 'Начать тестирование';
}

async function finishTest() {
  const answers = quiz.map((_, i) => {
    const s = document.querySelector('input[name="q' + i + '"]:checked');
    return s ? s.value : null;
  });

  const empty = answers.map((x, i) => x ? 0 : i + 1).filter(Boolean);
  if (empty.length) {
    el('testError').textContent = 'Не отвечены вопросы: ' + empty.join(', ');
    return;
  }

  el('finish').disabled = true;
  el('finish').textContent = 'Отправка...';
  el('testError').textContent = '';

  try {
    const d = await apiPost({
      kind: 'submit',
      session: SESSION,
      name: el('name').value.trim(),
      cls: el('cls').value.trim(),
      subject: subject,
      answers: answers
    });
    el('score').textContent = d.result.score + '/' + d.result.total;
    show('done');
  } catch (e) {
    el('finish').disabled = false;
    el('finish').textContent = 'Завершить тест';
    el('testError').textContent = e.message;
  }
}
</script>
</body>
</html>
