<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Пробный ЕНТ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,sans-serif}
header{background:#1749aa;color:#fff;text-align:center;padding:14px;font-size:19px;font-weight:bold;position:sticky;top:0;z-index:5}
#progress{font-size:14px;font-weight:normal;opacity:.9}
main{max-width:750px;margin:14px auto;padding:10px}
.card{background:#fff;padding:20px;border-radius:18px;box-shadow:0 4px 20px #0001}
h1{color:#1749aa;margin:0 0 6px;font-size:23px}
.field{display:block;font-weight:bold;margin:16px 0 7px}
input[type=text]{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;color:#172033;background:#fff}
button{width:100%;border:0;background:#1954c5;color:#fff;padding:15px;border-radius:10px;font-size:16px;margin-top:18px;cursor:pointer}
button:disabled{opacity:.5}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick.one{grid-template-columns:1fr}
.chip{padding:13px 10px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;cursor:pointer;background:#fff;color:#172033;user-select:none;text-align:center}
.chip.sel{background:#1954c5;border-color:#1954c5;color:#fff;font-weight:bold}
.question{padding:16px 0;border-bottom:1px solid #e2e8f0}
.question h3{font-size:16px;line-height:1.45;margin:0 0 8px;white-space:pre-wrap;font-weight:normal}
.question h3 b{color:#1749aa}
.option{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid #cbd5e1;border-radius:9px;margin:8px 0;cursor:pointer;line-height:1.4}
.option input{margin-top:3px}
.option.sel{background:#eaf1ff;border-color:#1954c5}
.hidden{display:none}
.muted{color:#64748b}
.error{color:#b91c1c}
.score{font-size:52px;font-weight:bold;color:#1954c5;margin:6px 0}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:15px}
td,th{border:1px solid #e2e8f0;padding:8px;text-align:center}
th{background:#f1f5f9}
.bad{color:#b91c1c;font-weight:bold}.good{color:#15803d;font-weight:bold}
</style>
</head>
<body>
<header>Пробный ЕНТ<div id="progress"></div></header>
<main>

<section class="card" id="entry">
<h1>Онлайн-тестирование</h1>
<p class="muted">20 вопросов, один правильный ответ в каждом</p>

<label class="field" for="name">Фамилия и имя</label>
<input id="name" type="text" placeholder="Иванов Иван" maxlength="100" autocomplete="off">

<label class="field" for="cls">Класс</label>
<input id="cls" type="text" placeholder="11А" maxlength="30" autocomplete="off">

<label class="field">Предмет</label>
<div id="subjects" class="pick"><p class="muted">Загрузка…</p></div>

<div id="testsBox" class="hidden">
<label class="field" id="testsLabel">Вариант</label>
<div id="tests" class="pick"></div>
</div>

<button id="start" onclick="begin()">Начать тестирование</button>
<p id="entryError" class="error"></p>
</section>

<section class="card hidden" id="test">
<h1 id="title"></h1>
<p class="muted">Выберите один ответ на каждый вопрос.</p>
<div id="questions"></div>
<button id="finish" onclick="finishTest()">Завершить тест</button>
<p id="testError" class="error"></p>
</section>

<section class="card hidden" id="done">
<h1>Тест завершён!</h1>
<p class="muted" id="doneTitle"></p>
<div class="score" id="score"></div>
<p>Результат отправлен учителю.</p>
<div id="review"></div>
</section>

</main>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzvoMNjElhxNlMOda9CLusFM2pp12zKTPS6fypLeWzjIYh8Gka7Cfz1lvRK5eYWPi43/exec';
const SESSION = new URLSearchParams(location.search).get('session') || '';
const ABC = 'ABCDE';
const el = id => document.getElementById(id);
let catalog = [], subject = '', test = '', quiz = [];

function show(id) {
  ['entry','test','done'].forEach(x => el(x).classList.toggle('hidden', x !== id));
  window.scrollTo(0, 0);
}

async function apiGet(params) {
  let d;
  try {
    const r = await fetch(API + '?' + new URLSearchParams(params));
    d = await r.json();
  } catch (e) { throw Error('Нет связи с сервером. Проверьте интернет и обновите страницу.'); }
  if (!d.ok) throw Error(d.error || 'Ошибка');
  return d;
}

async function apiPost(data) {
  let d;
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
    d = await r.json();
  } catch (e) { throw Error('Нет связи с сервером. Нажмите «Завершить тест» ещё раз.'); }
  if (!d.ok) throw Error(d.error || 'Ошибка');
  return d;
}

function chip(text, onClick) {
  const b = document.createElement('div');
  b.className = 'chip';
  b.textContent = text;
  b.onclick = () => { b.parentNode.querySelectorAll('.chip').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); onClick(); };
  return b;
}

function pickSubject(s) {
  subject = s; test = '';
  const item = catalog.find(x => x.subject === s);
  const box = el('tests');
  box.replaceChildren();
  el('testsLabel').textContent = s === 'Физика' ? 'Тема' : 'Вариант';
  box.className = item.tests.some(t => t.length > 14) ? 'pick one' : 'pick';
  item.tests.forEach(t => box.append(chip(t, () => { test = t; })));
  if (item.tests.length === 1) { box.firstChild.classList.add('sel'); test = item.tests[0]; }
  el('testsBox').classList.remove('hidden');
}

async function loadCatalog() {
  if (!SESSION) { el('subjects').replaceChildren(); el('entryError').textContent = 'Неверная ссылка: отсканируйте QR-код заново.'; el('start').disabled = true; return; }
  try {
    catalog = (await apiGet({ action: 'catalog', session: SESSION })).catalog;
    const box = el('subjects');
    box.replaceChildren();
    if (!catalog.length) { box.innerHTML = '<p class="muted">Тестов пока нет.</p>'; el('start').disabled = true; return; }
    box.className = 'pick';
    catalog.forEach(x => box.append(chip(x.subject, () => pickSubject(x.subject))));
  } catch (e) {
    el('subjects').replaceChildren();
    el('entryError').textContent = e.message;
    el('start').disabled = true;
  }
}
loadCatalog();

async function begin() {
  const name = el('name').value.trim(), cls = el('cls').value.trim();
  if (name.length < 3 || !cls) { el('entryError').textContent = 'Напишите фамилию, имя и класс.'; return; }
  if (!subject) { el('entryError').textContent = 'Выберите предмет.'; return; }
  if (!test) { el('entryError').textContent = 'Выберите вариант.'; return; }

  el('start').disabled = true; el('start').textContent = 'Загрузка…'; el('entryError').textContent = '';
  try {
    quiz = (await apiGet({ action: 'questions', session: SESSION, subject: subject, test: test })).questions;
    el('title').textContent = subject + ' · ' + test;
    const area = el('questions');
    area.replaceChildren();
    quiz.forEach((q, i) => {
      const sec = document.createElement('section');
      sec.className = 'question';
      const h = document.createElement('h3');
      const num = document.createElement('b');
      num.textContent = (i + 1) + '. ';
      h.append(num, document.createTextNode(q.text));
      sec.append(h);
      q.options.forEach((opt, j) => {
        const label = document.createElement('label');
        label.className = 'option';
        const radio = document.createElement('input');
        radio.type = 'radio'; radio.name = 'q' + i; radio.value = ABC[j];
        radio.onchange = () => { sec.querySelectorAll('.option').forEach(o => o.classList.remove('sel')); label.classList.add('sel'); progress(); };
        const span = document.createElement('span');
        span.textContent = ABC[j] + ') ' + opt;
        label.append(radio, span);
        sec.append(label);
      });
      area.append(sec);
    });
    progress();
    show('test');
  } catch (e) { el('entryError').textContent = e.message; }
  el('start').disabled = false; el('start').textContent = 'Начать тестирование';
}

function answersNow() {
  return quiz.map((_, i) => { const s = document.querySelector('input[name="q' + i + '"]:checked'); return s ? s.value : null; });
}
function progress() {
  const n = answersNow().filter(Boolean).length;
  el('progress').textContent = 'Отвечено: ' + n + ' из ' + quiz.length;
}

async function finishTest() {
  const answers = answersNow();
  const empty = answers.map((x, i) => x ? 0 : i + 1).filter(Boolean);
  if (empty.length) { el('testError').textContent = 'Не отвечены вопросы: ' + empty.join(', '); return; }
  if (!confirm('Завершить тест? Изменить ответы будет нельзя.')) return;

  el('finish').disabled = true; el('finish').textContent = 'Отправка…'; el('testError').textContent = '';
  try {
    const r = (await apiPost({ kind: 'submit', session: SESSION, name: el('name').value.trim(), cls: el('cls').value.trim(),
                               subject: subject, test: test, answers: answers })).result;
    el('doneTitle').textContent = subject + ' · ' + test;
    el('score').textContent = r.score + ' / ' + r.total;
    el('progress').textContent = '';
    let t = '<table><tr><th>№</th><th>Ваш ответ</th><th>Верный</th></tr>';
    answers.forEach((a, i) => {
      const ok = a === r.correct[i];
      t += '<tr><td>' + (i + 1) + '</td><td class="' + (ok ? 'good' : 'bad') + '">' + a + (ok ? ' ✓' : ' ✗') + '</td><td>' + r.correct[i] + '</td></tr>';
    });
    el('review').innerHTML = t + '</table>';
    show('done');
  } catch (e) {
    el('finish').disabled = false; el('finish').textContent = 'Завершить тест';
    el('testError').textContent = e.message;
  }
}
</script>
</body>
</html>
